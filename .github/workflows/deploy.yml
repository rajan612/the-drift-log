name: Deploy The Drift Log

on:
  push:
    branches:
      - master
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: the-drift-log-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Preview semantic release
        id: release_preview
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: ./website
          branches: '["master"]'
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Astro site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::866149839160:role/the-drift-log-github-deploy
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy site to S3
        run: aws s3 sync dist/ s3://the-drift-log-site-866149839160 --delete

      - name: Publish semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: ./website
          branches: '["master"]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
          LAST_RELEASE_VERSION: ${{ steps.release.outputs.last_release_version }}
          LAST_RELEASE_TAG: ${{ steps.release.outputs.last_release_git_tag }}
          PREVIEW_VERSION: ${{ steps.release_preview.outputs.new_release_version }}
          PREVIEW_TAG: ${{ steps.release_preview.outputs.new_release_git_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION:-${LAST_RELEASE_VERSION:-${PREVIEW_VERSION:-}}}"
          tag="${RELEASE_TAG:-${LAST_RELEASE_TAG:-${PREVIEW_TAG:-v$version}}}"

          if [ -z "$version" ]; then
            echo "No semantic release version was available."
            exit 1
          fi

          deployed_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          cat > /tmp/release.json <<EOF
          {
            "version": "$version",
            "tag": "$tag",
            "commit": "$COMMIT_SHA",
            "deployedAt": "$deployed_at",
            "environment": "prod",
            "region": "us-east-1"
          }
          EOF

          aws s3 cp /tmp/release.json s3://the-drift-log-site-866149839160/release.json --content-type application/json --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3PHJPRQXSZM5L --paths "/*"
